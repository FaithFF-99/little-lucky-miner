function audioReady(){audioContext??=new (window.AudioContext||window.webkitAudioContext)();if(!musicGain){musicGain=audioContext.createGain();musicGain.gain.value=.42;musicGain.connect(audioContext.destination);musicDelay=audioContext.createDelay(1);musicDelay.delayTime.value=.42;musicFeed=audioContext.createGain();musicFeed.gain.value=.16;musicDelay.connect(musicFeed);musicFeed.connect(musicDelay);musicFeed.connect(musicGain);}if(audioContext.state==='suspended')audioContext.resume();}
